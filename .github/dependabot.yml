version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # The Bryntum packages must stay on one version
      bryntum:
        patterns:
          - "@bryntum/*"
      dev-tools:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
