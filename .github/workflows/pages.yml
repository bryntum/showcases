name: Build and deploy

# Every pull request is linted, built and smoke tested. Pushes to main are linted, built and deployed to GitHub Pages
# without the smoke tests: small fixes go straight to main and should be live in under a minute, larger changes come
# through a pull request and are tested there
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch or pull request at a time. A deployment in progress is never cancelled
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Pull requests: smoke tests, which build and serve under /showcases/ themselves (see playwright.config.js)
      - if: github.event_name == 'pull_request'
        run: npx playwright install --with-deps chromium

      - if: github.event_name == 'pull_request'
        run: npm test

      - if: failure() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      # The deployed build, with Bryntum's GA4 property, consent denied (cookieless, no ads). Only the pages deployed
      # from this repository load it: the tests, local builds and the deploys of a fork build without it. The ID is
      # public, it could also come from a repository variable: SHOWCASES_GA4_ID: ${{ vars.SHOWCASES_GA4_ID }}
      - if: github.event_name != 'pull_request'
        run: npm run build
        env:
          SHOWCASES_GA4_ID: ${{ github.repository == 'bryntum/showcases' && 'G-1VY6776VJP' || '' }}

      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5
